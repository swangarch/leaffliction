<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaffliction Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('https://images.unsplash.com/photo-1545241047-6083a3684587?q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            color: #ffffff;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .welcome-msg {
            font-size: 1rem;
            color: #e0eae0;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .upload-box {
            border: 2px dashed rgba(255, 255, 255, 0.4);
            padding: 30px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
        }

        .upload-box:hover {
            border-color: #81c784;
            background: rgba(255, 255, 255, 0.1);
        }

        .upload-box p {
            margin-top: 10px;
            font-size: 0.95rem;
        }

        #hidden-file-input {
            display: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-window {
            background: #ffffff;
            color: #2c3e50;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-overlay.active .modal-window {
            transform: scale(1);
        }

        .modal-window h3 {
            color: #2e7d32;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .prediction-text {
            font-size: 1.2rem;
            font-weight: 600;
            background: #f1f8e9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid #4caf50;
        }

        .close-btn {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: #1b5e20;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h1>leaffliction</h1>
        <p class="welcome-msg">Welcome! Upload or capture a clear photo of your plant's leaf below to instantly diagnose its current health state using our trained CNN engine.</p>
        
        <div class="upload-box" onclick="document.getElementById('hidden-file-input').click()">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: #a5d6a7;"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 2 2 4a7 7 0 0 1-10 14z"></path><path d="M19 2c-2.26 4.33-5.27 7.14-8 10"></path></svg>
            <p id="upload-status-text">Click to choose or take a photo</p>
        </div>
        <input type="file" id="hidden-file-input" accept="image/jpeg, image/png">
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-window">
            <h3>Analysis Complete</h3>
            <p style="font-size: 0.9rem; color: #7f8c8d; margin-bottom: 8px;">Detected State / Category:</p>
            <div class="prediction-text" id="predictionValue">Healthy Leaf</div>
            <button class="close-btn" onclick="closeModal()">Dismiss</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('hidden-file-input');
        const statusText = document.getElementById('upload-status-text');
        const modal = document.getElementById('resultModal');
        const predictionValue = document.getElementById('predictionValue');

        fileInput.addEventListener('change', async (e) => {
            if (e.target.files.length === 0) return;
            
            const file = e.target.files[0];
            statusText.innerText = "Processing framework data...";
            
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('http://localhost:8011/leaffliction/predict', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server returned status code: ${response.status}`);
                }

                const data = await response.json();
                
                showModal(data.result.category);
            } catch (error) {
                alert(`Inference failed: ${error.message}`);
            } finally {
                statusText.innerText = "Click to choose or take a photo";
                fileInput.value = "";
            }
        });

        function showModal(resultText) {
            predictionValue.innerText = resultText;
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }
    </script>
</body>
</html>
